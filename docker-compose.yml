services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: answerly
      POSTGRES_USER: answerly
      POSTGRES_PASSWORD: answerly
    ports:
      - "5432:5432"
    volumes:
      - answerly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U answerly -d answerly"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  answerly-postgres:
